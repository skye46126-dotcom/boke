# Decap CMS 配置文件
# 文档: https://decapcms.org/docs/configuration-options/

# 后端配置
backend:
  name: git-gateway
  branch: main

# 本地开发模式
local_backend: true

# 媒体文件配置
media_folder: "frontend/public/images/uploads"
public_folder: "/images/uploads"

# 语言设置
locale: 'zh_Hans'

# 编辑器配置
editor:
  preview: true

# Slug 配置
slug:
  encoding: "ascii"
  clean_accents: true
  sanitize_replacement: "-"

# 内容集合
collections:
  # ==========================================
  # 文章管理
  # ==========================================
  - name: "articles"
    label: "📝 文章管理"
    label_singular: "文章"
    folder: "frontend/content/articles"
    create: true
    delete: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    editor:
      preview: true
    sortable_fields: ['date', 'title']
    view_filters:
      - label: "已发布"
        field: status
        pattern: 'published'
      - label: "草稿"
        field: status
        pattern: 'draft'
    fields:
      - label: "标题"
        name: "title"
        widget: "string"
        required: true
      
      - label: "Slug (URL路径)"
        name: "slug"
        widget: "string"
        required: true
        pattern: ['^[a-z0-9]+(?:-[a-z0-9]+)*$', "只能包含小写字母、数字和连字符"]
        hint: "文章的URL路径，如: my-first-post"
      
      - label: "发布日期"
        name: "date"
        widget: "datetime"
        date_format: "YYYY-MM-DD"
        time_format: false
        format: "YYYY-MM-DD"
        required: true
      
      - label: "状态"
        name: "status"
        widget: "select"
        options:
          - { label: "已发布", value: "published" }
          - { label: "草稿", value: "draft" }
        default: "draft"
      
      - label: "摘要"
        name: "excerpt"
        widget: "text"
        required: false
        hint: "文章简短描述，显示在列表页"
      
      - label: "封面图片"
        name: "cover_image"
        widget: "image"
        required: false
        media_folder: "frontend/public/images/covers"
        public_folder: "/images/covers"
      
      - label: "标签"
        name: "tags"
        widget: "list"
        required: false
      
      - label: "正文"
        name: "body"
        widget: "markdown"
        required: true

  # ==========================================
  # 相册管理
  # ==========================================
  - name: "gallery"
    label: "🖼️ 相册管理"
    description: "管理相册和图片。批量上传请访问 /admin/gallery"
    files:
      - name: "albums"
        label: "📁 相册列表"
        file: "frontend/content/gallery/albums.json"
        description: "管理相册分类"
        fields:
          - label: "相册列表"
            name: "albums"
            widget: "list"
            summary: "{{fields.name}} ({{fields.id}})"
            collapsed: false
            fields:
              - label: "相册 ID"
                name: "id"
                widget: "string"
                required: true
                pattern: ['^[a-z0-9-]+$', "只能包含小写字母、数字和连字符"]
              
              - label: "相册名称"
                name: "name"
                widget: "string"
                required: true
              
              - label: "描述"
                name: "description"
                widget: "text"
                required: false
              
              - label: "封面图片"
                name: "cover_image"
                widget: "image"
                required: false
                media_folder: "frontend/public/images/gallery"
                public_folder: "/images/gallery"
              
              - label: "分类"
                name: "category"
                widget: "select"
                options:
                  - { label: "风景", value: "landscape" }
                  - { label: "人像", value: "portrait" }
                  - { label: "生活", value: "life" }
                  - { label: "旅行", value: "travel" }
                  - { label: "美食", value: "food" }
                  - { label: "其他", value: "other" }
                default: "other"
              
              - label: "排序"
                name: "order"
                widget: "number"
                default: 0

      - name: "images"
        label: "🖼️ 图片管理"
        file: "frontend/content/gallery/images.json"
        description: "单张图片管理。批量上传请访问 /admin/gallery"
        fields:
          - label: "图片列表"
            name: "images"
            widget: "list"
            summary: "{{fields.title}} [{{fields.album_id}}]"
            collapsed: false
            fields:
              - label: "图片 ID"
                name: "id"
                widget: "string"
                required: true
                pattern: ['^[a-z0-9-]+$', "只能包含小写字母、数字和连字符"]
              
              - label: "图片"
                name: "img_url"
                widget: "image"
                required: true
                media_folder: "frontend/public/images/gallery"
                public_folder: "/images/gallery"
              
              - label: "标题"
                name: "title"
                widget: "string"
                required: true
              
              - label: "描述"
                name: "description"
                widget: "text"
                required: false
              
              - label: "所属相册"
                name: "album_id"
                widget: "string"
                required: false
                hint: "填写相册ID，如 travel-2024"
              
              - label: "分类"
                name: "category"
                widget: "select"
                options:
                  - { label: "风景", value: "landscape" }
                  - { label: "人像", value: "portrait" }
                  - { label: "生活", value: "life" }
                  - { label: "旅行", value: "travel" }
                  - { label: "美食", value: "food" }
                  - { label: "其他", value: "other" }
                default: "other"
              
              - label: "排序"
                name: "order"
                widget: "number"
                default: 0

  # ==========================================
  # 长廊管理
  # ==========================================
  - name: "corridor"
    label: "🏛️ 长廊管理"
    description: "管理长廊展示图片。长廊是全屏纵向浏览的作品展示区"
    files:
      - name: "corridor-images"
        label: "🖼️ 长廊图片"
        file: "frontend/content/gallery/corridor.json"
        description: "管理长廊展示的图片"
        fields:
          - label: "长廊图片列表"
            name: "images"
            widget: "list"
            summary: "{{fields.title}} (排序: {{fields.order}})"
            collapsed: false
            fields:
              - label: "图片 ID"
                name: "id"
                widget: "string"
                required: true
                pattern: ['^[a-z0-9-]+$', "只能包含小写字母、数字和连字符"]
              
              - label: "图片"
                name: "img_url"
                widget: "image"
                required: true
                media_folder: "frontend/public/images/corridor"
                public_folder: "/images/corridor"
              
              - label: "标题"
                name: "title"
                widget: "string"
                required: true
              
              - label: "描述"
                name: "description"
                widget: "text"
                required: false
                hint: "作品描述，将显示在图片下方"
              
              - label: "作者"
                name: "author"
                widget: "string"
                required: false
              
              - label: "拍摄日期"
                name: "date"
                widget: "datetime"
                date_format: "YYYY-MM-DD"
                time_format: false
                format: "YYYY-MM-DD"
                required: false
              
              - label: "排序"
                name: "order"
                widget: "number"
                default: 0
                hint: "数字越小越靠前"
